<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - My Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <div class="logo">MyWebsite</div>

            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">

        <section class="contact-section">

            <h1>Contact Us</h1>
            <p>Kontaktu ami liu husi form iha okos</p>

            <form>

                <label for="name">Naran</label>
                <input type="text" id="name" placeholder="Prense naran">

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Prense email">

                <label for="message">Mensajen</label>
                <textarea id="message" rows="5"
                    placeholder="Hakerek ita-boot nia mensajen..."></textarea>

                <button type="submit">Manda Mensajen</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
